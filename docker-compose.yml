version: '3.8'

services:
  db:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # Añadido healthcheck para la base de datos
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Espera 10 segundos antes de empezar a chequear

  grpc_server:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    restart: always
    ports:
      - "50051:50051"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
    depends_on:
      db: # Depende de que 'db' esté sano
        condition: service_healthy
    volumes:
      # Monta la carpeta 'app' de tu host en '/app' dentro del contenedor.
      - ./app:/app
      # ¡NUEVA LÍNEA CLAVE! Monta init.sql desde la raíz de tu host a /app/init.sql en el contenedor.
      - ./init.sql:/app/init.sql
    # El comando para ejecutar el servidor Python.
    # Usamos '-u' para forzar la salida sin búfer, lo que ayuda a ver los logs en tiempo real.
    command: python -u /app/app_grpc_server.py

volumes:
  postgres_data:
