# Ya no es necesario el atributo 'version' para las versiones recientes de Docker Compose
# version: '3.8' # Línea eliminada

services:
  # Servicio para el proxy Envoy
  envoy:
    image: envoyproxy/envoy:v1.29.0
    container_name: envoy_proxy
    ports:
      - "8080:8080" # ¡Host:Container! Este es el puerto que el cliente de Windows debe usar
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - app_network
    command: "envoy -c /etc/envoy/envoy.yaml --log-level trace" # Nivel de log a TRACE
    depends_on:
      - grpc_server # Envoy depende del servidor gRPC

  # Servicio para tu servidor gRPC en Python
  grpc_server:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    container_name: python_grpc_server
    ports:
      - "50051:50051" # Puerto interno del servidor gRPC
    networks:
      - app_network
    environment:
      DB_HOST: db # Apunta al servicio 'db' en Docker Compose
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
    depends_on:
      - db # El servidor gRPC depende del servicio 'db'

  # Servicio para la base de datos PostgreSQL
  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Monta el script de inicialización de la BD
    ports:
      - "${DB_PORT}:${DB_PORT}" # Opcional: para acceder a la BD desde tu host
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data: # Define el volumen para la persistencia de datos de PostgreSQL
