admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/productos.ProductosService/" # Prefijo para gRPC
                          route:
                            cluster: grpc_service # Apunta al cluster gRPC
                      # Asegúrate de que CORS esté bien configurado para gRPC-Web
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: "GET, PUT, POST, DELETE, OPTIONS"
                        allow_headers: "authorization,content-type,grpc-message,grpc-status,x-grpc-web" # Añadir x-grpc-web
                        expose_headers: "grpc-message,grpc-status"
                        max_age: "3600"
                http_filters:
                  - name: envoy.filters.http.grpc_web # Filtro gRPC-Web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_service # Nombre del cluster gRPC
      connect_timeout: 10s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      # Esto es crucial para gRPC:
      http2_protocol_options: {} # Habilitar HTTP/2
      load_assignment:
        cluster_name: grpc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: grpc_server
                      port_value: 50051 # Apunta al servicio gRPC
